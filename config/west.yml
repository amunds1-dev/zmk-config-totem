manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: zzeneg
      url-base: https://github.com/zzeneg
    - name: amunds1-dev
      url-base: https://github.com/amunds1-dev
    # Additional modules containing boards/shields/custom code can be listed here as well
    # See https://docs.zephyrproject.org/3.2.0/develop/west/manifest.html#projects
  projects:
    - name: zmk
      remote: zmkfirmware
      revision: main
      import: app/west.yml
    # Raw HID transport (USB + Bluetooth)
    - name: zmk-raw-hid
      remote: zzeneg
      revision: main
    # Sends the active layer to the on-screen overlay app
    - name: zmk-layer-overlay
      remote: amunds1-dev
      revision: main
  self:
    path: config
